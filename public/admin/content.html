<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#060F0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Website Content — Maison Lunar Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/admin/css/admin.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar"><h1>Website Content</h1><div class="who" id="adminWho"></div></div>

    <form id="contentForm">
      <div class="admin-card glass">
        <h2>Homepage Hero</h2>
        <div class="field"><label for="hero_eyebrow">Eyebrow Label</label><input type="text" id="hero_eyebrow"></div>
        <div class="field">
          <label for="hero_headline">Headline</label>
          <textarea id="hero_headline" style="min-height:70px;"></textarea>
          <div class="field-hint">Wrap words in *asterisks* to show them in gold italic. Press Enter for a line break.</div>
        </div>
        <div class="field"><label for="hero_description">Description</label><textarea id="hero_description"></textarea></div>
      </div>

      <div class="admin-card glass">
        <h2>About Section</h2>
        <div class="field"><label for="about_heading">Heading</label><input type="text" id="about_heading"></div>
        <div class="field"><label for="about_quote">Pull Quote</label><input type="text" id="about_quote"></div>
        <div class="field">
          <label for="about_body">Body Text</label>
          <textarea id="about_body" style="min-height:160px;"></textarea>
          <div class="field-hint">Leave a blank line between paragraphs.</div>
        </div>
        <label style="display:block; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--sage); margin-bottom:9px;">Fragrance Composition Strip</label>
        <div class="field-row">
          <div class="field"><label for="composition_top">Top Notes</label><input type="text" id="composition_top"></div>
          <div class="field"><label for="composition_heart">Heart Notes</label><input type="text" id="composition_heart"></div>
        </div>
        <div class="field"><label for="composition_base">Base Notes</label><input type="text" id="composition_base"></div>
      </div>

      <div class="admin-card glass">
        <h2>Section Intros</h2>
        <div class="field"><label for="services_intro">Services Section Intro</label><input type="text" id="services_intro"></div>
        <div class="field"><label for="gallery_intro">Gallery Section Intro</label><input type="text" id="gallery_intro"></div>
      </div>

      <div class="admin-card glass">
        <h2>Contact Information</h2>
        <div class="field-row">
          <div class="field"><label for="contact_email">Contact Email</label><input type="email" id="contact_email"></div>
          <div class="field"><label for="contact_address">Address / Availability</label><input type="text" id="contact_address"></div>
        </div>
      </div>

      <div class="admin-card glass">
        <h2>Footer</h2>
        <div class="field"><label for="footer_text">Footer Description</label><textarea id="footer_text"></textarea></div>
      </div>

      <div class="admin-card glass">
        <h2>Testimonials</h2>
        <div id="testimonialManager"></div>
        <button type="button" class="btn-icon" id="addTestimonialBtn">+ Add Testimonial</button>
      </div>

      <div class="admin-card glass">
        <h2>Promotional Banner</h2>
        <div class="field"><label for="banner_text">Banner Text (leave blank to hide)</label><input type="text" id="banner_text" placeholder="e.g. Free shipping on orders over £75"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="saveContentBtn">Save Changes</button>
      <div class="form-status" id="contentStatus"></div>
    </form>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/admin/js/admin-guard.js"></script>
<script>
(async function () {
  const admin = await initAdminShell();
  if (!admin) return;

  const { settings } = await adminApi('/api/admin/settings');
  ['hero_eyebrow','hero_headline','hero_description','about_heading','about_quote','about_body','composition_top','composition_heart','composition_base','services_intro','gallery_intro','contact_email','contact_address','footer_text','banner_text']
    .forEach(key => { const el = document.getElementById(key); if (el) el.value = settings[key] || ''; });

  let testimonials = [];
  try { testimonials = JSON.parse(settings.testimonials || '[]'); } catch { testimonials = []; }
  renderTestimonials();

  function renderTestimonials() {
    document.getElementById('testimonialManager').innerHTML = testimonials.map((t, i) => `
      <div class="field-row" style="margin-bottom:14px; align-items:end;" data-t-index="${i}">
        <div class="field" style="margin-bottom:0;"><label>Name</label><input type="text" class="t-name" value="${t.name || ''}"></div>
        <div class="field" style="margin-bottom:0;"><label>Role / Location</label><input type="text" class="t-role" value="${t.role || ''}"></div>
        <div class="field" style="margin-bottom:0; grid-column:1/-1;"><label>Quote</label><input type="text" class="t-quote" value="${t.quote || ''}"></div>
        <button type="button" class="btn-icon remove-t" style="grid-column:1/-1; width:fit-content; color:var(--danger);">Remove</button>
      </div>`).join('');
    document.querySelectorAll('.remove-t').forEach(btn => btn.addEventListener('click', (e) => {
      const idx = parseInt(e.target.closest('[data-t-index]').dataset.tIndex, 10);
      testimonials.splice(idx, 1);
      renderTestimonials();
    }));
  }

  document.getElementById('addTestimonialBtn').addEventListener('click', () => {
    testimonials.push({ name: '', role: '', quote: '' });
    renderTestimonials();
  });

  function collectTestimonials() {
    return Array.from(document.querySelectorAll('#testimonialManager [data-t-index]')).map(row => ({
      name: row.querySelector('.t-name').value.trim(),
      role: row.querySelector('.t-role').value.trim(),
      quote: row.querySelector('.t-quote').value.trim()
    })).filter(t => t.name && t.quote);
  }

  document.getElementById('contentForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById('contentStatus');
    const btn = document.getElementById('saveContentBtn');
    const payload = {};
    ['hero_eyebrow','hero_headline','hero_description','about_heading','about_quote','about_body','composition_top','composition_heart','composition_base','services_intro','gallery_intro','contact_email','contact_address','footer_text','banner_text']
      .forEach(key => { payload[key] = document.getElementById(key).value.trim(); });
    payload.testimonials = JSON.stringify(collectTestimonials());

    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      await adminApi('/api/admin/settings', { method: 'PUT', body: payload });
      statusEl.className = 'form-status success'; statusEl.textContent = 'Changes saved — the live site is updated immediately.';
    } catch (err) {
      statusEl.className = 'form-status error'; statusEl.textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Save Changes';
    }
  });
})();
</script>
</body>
</html>
