<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#060F0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Customers — Maison Lunar Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/admin/css/admin.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar"><h1>Customers</h1><div class="who" id="adminWho"></div></div>

    <div class="admin-card glass">
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Status</th><th></th></tr></thead>
          <tbody id="customersTbody"><tr><td colspan="5" style="color:var(--sage);">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="customerModal">
  <div class="modal-box">
    <h2>Customer Profile</h2>
    <div id="customerDetail"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="closeCustomerModal">Close</button></div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/admin/js/admin-guard.js"></script>
<script>
(async function () {
  const admin = await initAdminShell();
  if (!admin) return;

  async function load() {
    const { customers } = await adminApi('/api/admin/customers');
    const tbody = document.getElementById('customersTbody');
    if (customers.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="color:var(--sage);">No customers yet.</td></tr>'; return; }
    tbody.innerHTML = customers.map(c => `
      <tr>
        <td>${c.full_name}</td>
        <td>${c.email}</td>
        <td>${formatDate(c.created_at)}</td>
        <td><span class="pill-toggle ${c.is_active ? 'on' : 'off'}">${c.is_active ? 'Active' : 'Disabled'}</span></td>
        <td>
          <button class="btn-icon" data-view="${c.id}">View</button>
          <button class="btn-icon" data-toggle="${c.id}" data-active="${c.is_active}">${c.is_active ? 'Disable' : 'Enable'}</button>
        </td>
      </tr>`).join('');

    tbody.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => viewCustomer(btn.dataset.view)));
    tbody.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', async () => {
      const nextActive = btn.dataset.active === '1' || btn.dataset.active === 'true' ? false : true;
      await adminApi('/api/admin/customers/' + btn.dataset.toggle, { method: 'PATCH', body: { is_active: nextActive } });
      load();
    }));
  }

  async function viewCustomer(id) {
    const { customer, orders } = await adminApi('/api/admin/customers/' + id);
    document.getElementById('customerDetail').innerHTML = `
      <p style="margin-bottom:4px;"><strong>${customer.full_name}</strong></p>
      <p style="font-size:13px; color:var(--sage); margin-bottom:18px;">${customer.email} &middot; joined ${formatDate(customer.created_at)}</p>
      <h3 style="font-size:14px; margin-bottom:10px;">Order History</h3>
      ${orders.length ? `<div class="table-wrap"><table class="admin-table"><thead><tr><th>Order</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody>
        ${orders.map(o => `<tr><td>${o.order_number}</td><td>${adminFormatMoney(o.total_cents)}</td><td><span class="status-pill ${o.status}">${o.status}</span></td><td>${formatDate(o.created_at)}</td></tr>`).join('')}
      </tbody></table></div>` : '<p style="color:var(--sage); font-size:13px;">No orders yet.</p>'}`;
    document.getElementById('customerModal').classList.add('open');
  }

  document.getElementById('closeCustomerModal').addEventListener('click', () => document.getElementById('customerModal').classList.remove('open'));
  document.getElementById('customerModal').addEventListener('click', (e) => { if (e.target.id === 'customerModal') e.target.classList.remove('open'); });

  load();
})();
</script>
</body>
</html>
