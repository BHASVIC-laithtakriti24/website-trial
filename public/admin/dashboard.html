<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#060F0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard — Maison Lunar Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/admin/css/admin.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Dashboard</h1>
      <div class="who" id="adminWho"></div>
    </div>

    <div class="stat-grid" id="statGrid">
      <div class="stat-card glass"><div class="label">Total Products</div><div class="value">&mdash;</div></div>
      <div class="stat-card glass"><div class="label">Total Customers</div><div class="value">&mdash;</div></div>
      <div class="stat-card glass"><div class="label">Orders</div><div class="value">&mdash;</div></div>
      <div class="stat-card glass"><div class="label">Revenue</div><div class="value">&mdash;</div></div>
    </div>

    <div class="admin-card glass">
      <h2>Recent Orders</h2>
      <div class="table-wrap">
        <table class="admin-table" id="recentOrdersTable">
          <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
          <tbody><tr><td colspan="5" style="color:var(--sage);">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="admin-card glass">
      <h2>Recent Messages</h2>
      <div id="recentMessages"><p style="color:var(--sage); font-size:13px;">Loading...</p></div>
    </div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/admin/js/admin-guard.js"></script>
<script>
(async function () {
  const admin = await initAdminShell();
  if (!admin) return;

  const stats = await adminApi('/api/admin/stats');
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card glass"><div class="label">Total Products</div><div class="value">${stats.total_products}</div></div>
    <div class="stat-card glass"><div class="label">Total Customers</div><div class="value">${stats.total_customers}</div></div>
    <div class="stat-card glass"><div class="label">Orders</div><div class="value">${stats.total_orders}</div></div>
    <div class="stat-card glass"><div class="label">Revenue</div><div class="value">${adminFormatMoney(stats.revenue_cents)}</div></div>`;

  const ordersTbody = document.querySelector('#recentOrdersTable tbody');
  ordersTbody.innerHTML = stats.recent_orders.length ? stats.recent_orders.map(o => `
    <tr>
      <td>${o.order_number}</td>
      <td>${o.customer_name}</td>
      <td>${adminFormatMoney(o.total_cents)}</td>
      <td><span class="status-pill ${o.status}">${o.status}</span></td>
      <td>${formatDate(o.created_at)}</td>
    </tr>`).join('') : '<tr><td colspan="5" style="color:var(--sage);">No orders yet.</td></tr>';

  const msgRoot = document.getElementById('recentMessages');
  msgRoot.innerHTML = stats.recent_messages.length ? stats.recent_messages.map(m => `
    <div class="msg-item ${m.is_read ? '' : 'unread'}">
      <div class="top-row"><span>${m.name} &middot; ${m.email}</span><span>${formatDate(m.created_at)}</span></div>
      <div class="subject">${m.subject}</div>
    </div>`).join('') : '<p style="color:var(--sage); font-size:13px;">No messages yet.</p>';
})();
</script>
</body>
</html>
