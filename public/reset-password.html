<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#060F0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password — Maison Lunar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<header>
  <nav class="nav">
    <a href="/" class="brand"><svg class="moon-mark" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="#CBB88B" stroke-width="1.3" stroke-linejoin="round"/></svg>MAISON LUNAR</a>
    <ul class="nav-links" id="navLinks"><li><a href="/login.html">Login</a></li></ul>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </nav>
</header>

<main>
  <div class="auth-wrap">
    <div class="section-head" style="text-align:left; max-width:none; margin-bottom:30px;">
      <div class="eyebrow">Account Security</div>
      <h1 style="font-family:var(--font-display); font-weight:500; font-size:1.8rem; margin-top:10px;">Set a New Password</h1>
    </div>
    <div class="auth-card glass">
      <form id="resetForm" novalidate>
        <div class="field" data-field="password">
          <label for="newPassword">New Password</label>
          <div class="password-field">
            <input type="password" id="newPassword" required>
            <button type="button" class="password-toggle" data-target="newPassword">Show</button>
          </div>
          <div class="field-hint">At least 8 characters, with a letter and a number.</div>
          <div class="field-error">Password must be at least 8 characters with a letter and a number.</div>
        </div>
        <div class="field" data-field="confirm">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="password-field">
            <input type="password" id="confirmPassword" required>
            <button type="button" class="password-toggle" data-target="confirmPassword">Show</button>
          </div>
          <div class="field-error">Passwords do not match.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="resetSubmit">Reset Password</button>
        <div class="form-status" id="resetStatus"></div>
      </form>
    </div>
  </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
  const token = new URLSearchParams(location.search).get('token');
  const form = document.getElementById('resetForm');
  const statusEl = document.getElementById('resetStatus');

  if (!token) {
    statusEl.className = 'form-status error';
    statusEl.textContent = 'This reset link is missing its token. Please request a new one from the login page.';
    form.querySelector('button[type="submit"]').disabled = true;
  }

  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? 'Show' : 'Hide';
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const pwOk = password.length >= 8 && /[A-Za-z]/.test(password) && /[0-9]/.test(password);

    document.querySelector('[data-field="password"]').classList.toggle('invalid', !pwOk);
    document.querySelector('[data-field="confirm"]').classList.toggle('invalid', password !== confirm);
    if (!pwOk || password !== confirm) return;

    const btn = document.getElementById('resetSubmit');
    btn.disabled = true; btn.textContent = 'Resetting...';
    try {
      await api('/api/auth/reset-password', { method: 'POST', body: { token, password } });
      statusEl.className = 'form-status success';
      statusEl.textContent = 'Your password has been reset. You can now log in with your new password.';
      form.reset();
      setTimeout(() => { location.href = LUNAR_URL('/login.html'); }, 1800);
    } catch (err) {
      statusEl.className = 'form-status error';
      statusEl.textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Reset Password';
    }
  });
})();
</script>
</body>
</html>
